<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IKTS – Page en préparation</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F3F5F7;color:#2B2F36;font:16px/1.6 Inter,system-ui,sans-serif;padding:16px;box-sizing:border-box}
.box{max-width:560px;background:#fff;border-radius:16px;padding:40px 32px;text-align:center;box-shadow:0 12px 32px rgba(27,79,138,.12)}
.emoji{font-size:48px}
h1{font:800 40px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:12px 0}
p{color:#5B636E;margin:0 0 24px}
a{display:inline-block;background:#1F6FA8;color:#fff;text-decoration:none;padding:14px 24px;border-radius:8px;font-weight:600}
</style>
</head>
<body>
<div class="box">
<div class="emoji" aria-hidden="true">🚧</div>
<h1 id="t">Page en préparation</h1>
<p>Cette page fera partie du site final. Les maquettes présentent pour l'instant la page d'accueil.</p>
<a href="javascript:history.back()">← Revenir à la maquette</a>
</div>
<script>
var p=new URLSearchParams(location.search).get('p');
if(p){document.getElementById('t').textContent=p;document.title='IKTS – '+p;}
</script>
</body>
</html>
